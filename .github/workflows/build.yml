name: build-vst3
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build_vst3.bat
      - uses: actions/upload-artifact@v4
        with: { name: LA2A_ManualFaithful-vst3, path: dist/ }
